name: 每日重新生成

on:
  schedule:
    - cron: '7 11 * * *'   # 每天 11:07 UTC（美国亚利桑那时间 04:07）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Phoenix   # 文件里的日期按亚利桑那时间写
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: 安装依赖
        run: pip install pyyaml==6.0.3
      - name: 生成覆写
        run: python -I build_override.py adblock.stoverride
      - name: 有变化就提交
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adblock.stoverride
          if git diff --cached --quiet; then
            echo '没有变化'
          else
            git commit -m "每日更新 $(date +%F)"
            git push
          fi
